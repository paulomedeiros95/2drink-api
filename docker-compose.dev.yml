# Servicos LOCAIS para desenvolvimento (senhas abaixo servem apenas para a sua maquina; nunca use em producao).
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        (apaga os dados; nada e guardado em volume)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: twodrink
      POSTGRES_USER: twodrink_owner
      POSTGRES_PASSWORD: owner_dev_pw
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twodrink_owner -d twodrink"]
      interval: 3s
      timeout: 3s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
